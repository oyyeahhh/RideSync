<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password · CarpoolSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Changa+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='storybook.css') }}">
  <style>
    .lede { color: var(--color-cloud-white); font-size: 15px; margin-bottom: 18px; }
  </style>
</head>
<body>

<header>
  <a href="/"><img src="/static/carpoolsynclogo.png" alt="CarpoolSync"></a>
</header>

{% include "_sky.html" %}

<main>
  <div class="sheet">
    <h1>New password</h1>
    <p class="lede">Eight characters or more. Type it twice so a typo cannot lock you out again.</p>

    {% if error %}
    <div class="notice bad">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ action }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="new-password">New password</label>
        <div class="pw-wrap">
          <input type="password" id="new-password" name="password" autocomplete="new-password" minlength="8" required autofocus>
          <button type="button" onclick="togglePw('new-password', 'eye-new')" id="eye-new" class="pw-eye" aria-label="Show password" title="Show or hide password">
            <svg class="open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.6 12S5.5 5.2 12 5.2 22.4 12 22.4 12 18.5 18.8 12 18.8 1.6 12 1.6 12z"/>
              <circle cx="12" cy="12" r="3.2"/>
            </svg>
            <svg class="shut" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 5.5c2.3 3 5.3 4.6 9 4.6s6.7-1.6 9-4.6"/>
              <path d="M12 10.1V14"/>
              <path d="M6.4 8.9 4.3 12.2"/>
              <path d="M17.6 8.9l2.1 3.3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirm-password">Type it again</label>
        <div class="pw-wrap">
          <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" required>
          <button type="button" onclick="togglePw('confirm-password', 'eye-confirm')" id="eye-confirm" class="pw-eye" aria-label="Show password" title="Show or hide password">
            <svg class="open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1.6 12S5.5 5.2 12 5.2 22.4 12 22.4 12 18.5 18.8 12 18.8 1.6 12 1.6 12z"/>
              <circle cx="12" cy="12" r="3.2"/>
            </svg>
            <svg class="shut" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 5.5c2.3 3 5.3 4.6 9 4.6s6.7-1.6 9-4.6"/>
              <path d="M12 10.1V14"/>
              <path d="M6.4 8.9 4.3 12.2"/>
              <path d="M17.6 8.9l2.1 3.3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Save password</button>
    </form>

    <div class="under">
      <a class="sign-link" href="/login">Back to sign in</a>
    </div>
  </div>
</main>

<script>
  function togglePw(inputId, buttonId) {
    const inp = document.getElementById(inputId);
    const btn = document.getElementById(buttonId);
    const showing = inp.type === 'password';
    inp.type = showing ? 'text' : 'password';
    btn.classList.toggle('on', showing);
    btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
  }
</script>

</body>
</html>
